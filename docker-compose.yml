name: lms

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5433:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for course images and videos.
  # API on :9000, web console at http://localhost:9001/rustfs/console/ (log in with the keys below).
  storage:
    image: rustfs/rustfs:latest
    container_name: lms-storage
    environment:
      RUSTFS_ACCESS_KEY: lmsaccess
      RUSTFS_SECRET_KEY: lmssecret123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms_storage_data:/data

volumes:
  lms_postgres_data:
  lms_storage_data:
